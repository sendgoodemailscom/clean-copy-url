<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, monospace;
      width: 320px;
      padding: 14px;
      background: #0f0f0f;
      color: #e5e5e5;
    }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 6px;
    }
    .url-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-all;
      color: #a3e635;
      min-height: 40px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 9px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn:hover { background: #2563eb; }
    .btn.copied { background: #16a34a; }
    .hint {
      text-align: center;
      font-size: 10px;
      color: #444;
      margin-top: 8px;
    }
    .stripped {
      margin-top: 10px;
    }
    .stripped-list {
      font-size: 10px;
      color: #ef4444;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 12px;
      line-height: 1.8;
    }
    .stripped-list span { display: block; }
  </style>
</head>
<body>
  <div class="label">Clean URL</div>
  <div class="url-box" id="cleanUrl">Loading...</div>
  <button class="btn" id="copyBtn">Copy clean URL</button>
  <div class="hint">or use ⌘⇧K anywhere</div>
  <div class="stripped" id="strippedSection" style="display:none">
    <div class="label" style="margin-top:10px">Stripped params</div>
    <div class="stripped-list" id="strippedList"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
