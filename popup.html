<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#15121f;--cyan:#00E5FF;--yellow:#FFE347;--pink:#FF3FA4;--orange:#FB5124;--green:#2ECC71;--muted:#6b5b8a}
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:320px;padding:16px;background:#fff;color:var(--ink);font-family:'Space Grotesk',-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}

    .header{display:flex;align-items:center;gap:9px;padding-bottom:12px;margin-bottom:14px;border-bottom:3px solid var(--ink)}
    .header img{width:26px;height:26px;display:block}
    .header .title{font-size:15px;font-weight:700;letter-spacing:-0.01em}

    .label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:6px}

    .url-box{background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);padding:10px 12px;font-size:11px;line-height:1.5;word-break:break-all;color:var(--ink);font-family:'JetBrains Mono',monospace;min-height:42px;margin-bottom:14px}

    .btn{width:100%;padding:11px;background:var(--pink);color:var(--ink);border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:transform 0.1s,box-shadow 0.1s}
    .btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
    .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
    .btn.copied{background:var(--green)}

    .hint{text-align:center;font-size:10px;color:var(--muted);margin-top:9px;font-family:'JetBrains Mono',monospace}
    .hint kbd{font-family:inherit;font-weight:700;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);border-radius:4px;padding:0 5px}

    .stripped{margin-top:16px}
    .stripped-list{display:flex;flex-wrap:wrap;gap:6px}
    .stripped-list span{font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px}
  </style>
</head>
<body>
  <div class="header">
    <img src="icon32.png" alt="">
    <span class="title">Clean Copy URL</span>
  </div>
  <div class="label">Clean URL</div>
  <div class="url-box" id="cleanUrl">Loading…</div>
  <button class="btn" id="copyBtn">Copy clean URL</button>
  <div class="hint">or press <kbd>⌘⇧K</kbd> anywhere</div>
  <div class="stripped" id="strippedSection" style="display:none">
    <div class="label">Stripped params</div>
    <div class="stripped-list" id="strippedList"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
